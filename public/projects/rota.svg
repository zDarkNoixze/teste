      <text x="212" y="86" fill="#8fbfa2" font-size="18">CO₂ evitado</text>
    </g>
  </g>
  <!-- phone 1 -->
  <g transform="translate(860 120) rotate(-6)" filter="url(#sh)">
    <rect width="360" height="740" rx="54" fill="#0a0f0c"/>
    <rect x="16" y="16" width="328" height="708" rx="42" fill="url(#screen)"/>
    <!-- map -->
    <g opacity=".9">
      <path d="M16 140 L344 220 M16 330 L344 260 M120 16 L170 724 M260 16 L230 724 M16 520 L344 600" stroke="#ffffff" stroke-width="18"/>
      <path d="M16 140 L344 220 M16 330 L344 260 M120 16 L170 724 M260 16 L230 724 M16 520 L344 600" stroke="#b5dcc2" stroke-width="2"/>
      <rect x="40" y="380" width="70" height="90" rx="10" fill="#a7d8b6"/>
      <rect x="270" y="420" width="60" height="70" rx="10" fill="#a7d8b6"/>
    </g>
    <path d="M90 600 C120 520 150 470 160 400 S220 300 250 210 S280 150 300 110" fill="none" stroke="#16a34a" stroke-width="10" stroke-linecap="round"/>
    <circle cx="90" cy="600" r="16" fill="#fff" stroke="#16a34a" stroke-width="7"/>
    <circle cx="300" cy="110" r="18" fill="#16a34a"/>
    <circle cx="300" cy="110" r="7" fill="#fff"/>
    <rect x="34" y="560" width="292" height="146" rx="26" fill="#ffffff"/>
    <circle cx="80" cy="610" r="24" fill="#bbf7d0"/>
    <text x="118" y="604" fill="#052e16" font-family="sans-serif" font-size="20" font-weight="700">Marina · 4,9★</text>
    <text x="118" y="630" fill="#4b6b57" font-family="sans-serif" font-size="15">Chega em 6 min · 3 vagas</text>
