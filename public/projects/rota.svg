    <text x="160" y="232" fill="#ecfdf3" font-family="sans-serif" font-size="44" font-weight="800" text-anchor="middle">74%</text>
    <text x="160" y="262" fill="#8fbfa2" font-family="sans-serif" font-size="15" text-anchor="middle">18,2 kg de CO₂</text>
