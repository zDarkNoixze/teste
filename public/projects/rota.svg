<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#062417"/>
      <stop offset="1" stop-color="#0b1512"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dff5e6"/>
      <stop offset="1" stop-color="#c7ead3"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="30" stdDeviation="30" flood-opacity=".45"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="300" cy="820" r="420" fill="#4ade80" opacity=".07"/>
  <g font-family="sans-serif">
    <text x="130" y="260" fill="#4ade80" font-size="22" font-weight="700" letter-spacing="6">ROTA VERDE</text>
    <text x="130" y="350" fill="#ecfdf3" font-size="76" font-weight="800">Vá junto.</text>
    <text x="130" y="436" fill="#ecfdf3" font-size="76" font-weight="800">Polua menos.</text>
    <text x="130" y="510" fill="#8fbfa2" font-size="26">Caronas inteligentes para quem faz o mesmo caminho.</text>
    <rect x="130" y="570" width="250" height="70" rx="35" fill="#4ade80"/>
    <text x="255" y="614" fill="#052e16" font-size="24" font-weight="700" text-anchor="middle">Baixar o app</text>
