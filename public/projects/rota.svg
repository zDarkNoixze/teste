    <text x="180" y="678" fill="#fff" font-family="sans-serif" font-size="17" font-weight="700" text-anchor="middle">Confirmar carona</text>
  </g>
  <!-- phone 2 -->
  <g transform="translate(1180 210) rotate(5)" filter="url(#sh)">
