# Example nginx config for a VM. Copy to /etc/nginx/conf.d/portfolio.conf.
# Build locally (`pnpm build`) and upload dist/ to /var/www/portfolio.
#
# Optional brotli: needs ngx_brotli (apt install libnginx-mod-brotli). Uncomment the brotli lines.
# HTTPS: sudo apt install certbot python3-certbot-nginx
#        sudo certbot --nginx -d example.com -d www.example.com
#        (certbot adds the 443 block + redirect automatically).

map $uri $cache_control {
    default       "public, max-age=86400";
    ~^/assets/    "public, max-age=31536000, immutable";
    ~*\.html$     "no-cache";
    /             "no-cache";
    /poster.json  "no-cache";
}

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    root /var/www/portfolio;
    index index.html;

    # Serve the .gz files created by the build; fall back to on-the-fly gzip.
    gzip_static on;
    # brotli_static on;
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml
               text/plain application/xml application/wasm application/octet-stream;
    # brotli on;
    # brotli_types text/css text/javascript application/javascript application/json image/svg+xml application/octet-stream;

    types {
        application/octet-stream hdr;
        image/webp               webp;
        image/avif               avif;
    }

    # add_header in a location replaces these, so they are repeated there.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # add_header Strict-Transport-Security "max-age=31536000" always;  # only once HTTPS works

    location / {
        try_files $uri $uri/ @fallback;
        add_header Cache-Control $cache_control always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Extensionless unknown paths get index.html; missing files 404.
    location @fallback {
        if ($uri ~ "\.[a-zA-Z0-9]+$") { return 404; }
        rewrite ^ /index.html break;
    }

    location ~ /\. { deny all; }
}
